name: CI & DevSecOps - Flag Service

# Define quando o pipeline será disparado (neste caso, em push ou pull request na branch principal)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na versão especificada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Atualiza o gerenciador de pacotes e instala as dependências da aplicação e o linter
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 4. Realiza a análise estática do código (Linting) para pegar erros de sintaxe ou estilo
      - name: Análise Estática de Código (Linter Flake8)
        run: |
          # Checa erros críticos que quebram a aplicação
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Checa complexidade e avisos gerais sem quebrar o build obrigatoriamente
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. Executa o Scanner de Segurança (SAST/SCA) no código fonte usando o Trivy
      - name: Security Scan (SAST & SCA com Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Interrompe o pipeline se achar vulnerabilidades Críticas ou Altas
          severity: 'CRITICAL,HIGH'

      # 6. Configura as credenciais de acesso à AWS usando os segredos salvos no repositório
      - name: Configurar Credenciais da AWS (ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 7. Faz o login autenticado no registro de containers da AWS (Amazon ECR)
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Constrói a imagem Docker do microsserviço com a tag baseada no commit e como latest
      - name: Build da Imagem Docker
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: flag-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .

      # 9. Realiza um novo Scan de Segurança na imagem Docker recém-criada
      - name: Security Scan na Imagem Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/flag-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Bloqueia o envio se a imagem contiver vulnerabilidades graves
          severity: 'CRITICAL,HIGH'

      # 10. Envia (Push) a imagem validada e segura para o repositório do Amazon ECR
      - name: Push da Imagem para o Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: flag-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
